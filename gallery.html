<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Foto - Kelas 9I 📸</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="gallery.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="particles" id="particles"></div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">9<span>I</span></a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">← Kembali ke Home</a></li>
            </ul>
        </div>
    </nav>

    <section class="gallery-hero">
        <h1 class="section-title">Galeri <span>Foto Kenangan</span></h1>
        <p class="section-desc">22 momen indah kelas 9I yang terabadikan</p>
    </section>

    <section class="gallery-section">
        <div class="gallery-grid" id="galleryGrid"></div>
    </section>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightboxClose">&times;</span>
        <span class="lightbox-nav lightbox-prev" id="lightboxPrev">&#10094;</span>
        <img src="" alt="" class="lightbox-img" id="lightboxImg">
        <span class="lightbox-nav lightbox-next" id="lightboxNext">&#10095;</span>
        <div class="lightbox-counter" id="lightboxCounter"></div>
    </div>

    <audio id="backsound" loop>
        <source src="assets/backsound.mp3" type="audio/mpeg">
    </audio>
    <button class="music-toggle" id="musicToggle">🎵</button>

    <script src="gallery.js"></script>
    <script src="script.js"></script>
</body>
  </html>
